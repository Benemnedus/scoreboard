<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoreboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐒</text></svg>">
<style>
  :root {
    --bg: #101014;
    --card: #1a1a20;
    --card-hover: #202028;
    --border: #2b2b33;
    --text: #f4f2ec;
    --muted: #8b8a92;
    --gold: #f2b84b;
    --error: #ff4d4d;
    --success: #7ed492;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 3rem 1rem 2rem;
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><text y="24" font-size="24">🍌</text></svg>') 16 16, auto;
    background: var(--bg);
    position: relative;
  }
  button, a, input, select, textarea, .plus-btn {
    cursor: inherit;
  }

  #bg-pattern {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    display: grid;
    grid-template-columns: repeat(auto-fill, 150px);
    grid-auto-rows: 150px;
    pointer-events: none;
    overflow: hidden;
  }
  .bg-cell {
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  .eyebrow {
    font-size: 0.7rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
    margin: 0 0 0.5rem;
    z-index: 1;
  }
  h1 {
    font-size: 2.1rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 0.35rem;
    text-align: center;
    background: linear-gradient(90deg,
      #ff3b3b, #ff9d3b, #ffe23b, #3bff6e, #3bd4ff, #6e3bff, #ff3bd4, #ff3b3b);
    background-size: 400% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: rainbow 6s linear infinite;
    z-index: 1;
  }
  @keyframes rainbow {
    0% { background-position: 0% 50%; }
    100% { background-position: 400% 50%; }
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 0 0 2.5rem;
    text-align: center;
    z-index: 1;
  }
  .board {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
    border: 2px solid var(--gold);
    border-radius: 24px;
    padding: 1.5rem 1rem;
    background: rgba(16,16,20,0.85);
    box-shadow: 0 0 30px rgba(242,184,75,0.3);
    z-index: 1;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 1rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 0.85rem 1rem;
    position: relative;
    overflow: visible;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .row::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--rank-color, var(--gold));
    border-radius: 18px 0 0 18px;
  }
  .row:hover { background: var(--card-hover); border-color: var(--rank-color, var(--gold)); }

  .avatar-wrap {
    position: relative;
    flex-shrink: 0;
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .melon-orbit {
    position: absolute;
    width: 94px;
    height: 94px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: spin 10s linear infinite;
    pointer-events: none;
    z-index: 1;
  }
  .melon-item {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 20px;
    height: 20px;
    margin: -10px 0 0 -10px;
    font-size: 16px;
    line-height: 20px;
    text-align: center;
    transform: rotate(calc(var(--i) * 45deg)) translateX(44px);
  }
  .avatar-ring {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: color-mix(in srgb, var(--rank-color) 22%, transparent);
    border: 2px solid var(--rank-color);
    position: relative;
    z-index: 2;
    overflow: hidden;
  }
  .avatar-ring svg { width: 40px; height: 40px; display: block; }
  .avatar-ring.leader {
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--rank-color) 35%, transparent);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--rank-color) 35%, transparent); }
    50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--rank-color) 20%, transparent); }
  }
  @keyframes spin {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to { transform: translate(-50%, -50%) rotate(360deg); }
  }
  .kfc-leg {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.4rem;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.6));
    z-index: 3;
    pointer-events: none;
    animation: bounce 1.1s ease infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-6px); }
  }

  .info { flex: 1; min-width: 0; }
  .name {
    font-weight: 700;
    font-size: 1.05rem;
    margin: 0 0 0.15rem;
  }
  .rank-label {
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .score {
    font-size: 1.7rem;
    font-weight: 800;
    min-width: 2.6ch;
    text-align: right;
    font-variant-numeric: tabular-nums;
    transition: transform 0.15s ease;
  }
  .score.bump { transform: scale(1.25); }

  .plus-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: var(--gold);
    color: #16130a;
    font-size: 1.4rem;
    font-weight: 800;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s ease, filter 0.15s ease, opacity 0.2s;
    flex-shrink: 0;
  }
  .plus-btn:hover { filter: brightness(1.1); }
  .plus-btn:active { transform: scale(0.88); }
  .plus-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    filter: none;
  }

  .status {
    margin-top: 1.75rem;
    font-size: 0.78rem;
    color: var(--muted);
    text-align: center;
    min-height: 1.2em;
    z-index: 1;
  }

  #monkeyContainer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    overflow: hidden;
  }
  .monkey {
    position: absolute;
    font-size: 2rem;
    opacity: 0.8;
    filter: drop-shadow(0 0 6px rgba(0,0,0,0.4));
    animation-iteration-count: infinite;
    animation-timing-function: linear, ease-in-out;
    animation-fill-mode: both;
  }
  .monkey-ltr {
    animation-name: flyLTR, wobble;
  }
  .monkey-rtl {
    animation-name: flyRTL, wobble;
  }
  @keyframes flyLTR {
    0%   { left: -10%; }
    100% { left: 110%; }
  }
  @keyframes flyRTL {
    0%   { left: 110%; }
    100% { left: -10%; }
  }
  @keyframes wobble {
    0%   { transform: translateY(0) rotate(-10deg); }
    100% { transform: translateY(-20px) rotate(10deg); }
  }
</style>
</head>
<body>

  <div id="bg-pattern"></div>

  <p class="eyebrow"></p>
  <h1>RACISM SCORE OF THE DAY</h1>
  <p class="subtitle"></p>

  <div class="board" id="board"></div>
  <p class="status" id="status">Lade Punktestand …</p>

  <div id="monkeyContainer"></div>

<script>
  const PLAYERS = [
    { name: "Luca", color: "#f2b84b" },
    { name: "Ali", color: "#6fb3ff" },
    { name: "Alex", color: "#7ed492" }
  ];

  let scores = {};

  const gifUrls = [
    "https://i.giphy.com/z8pi6Q8wTxuFO.webp",
    "https://i.giphy.com/SDeVLvFCqFsSA.webp",
    "https://i.giphy.com/9A51YP5RfEaM2PjiNP.webp",
    "https://i.giphy.com/wtNOUuCzFKcaA.webp",
    "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExMTlqd3V6MGptM2VoNzRlNGJhYWdrODJ4bTZmeWZ6ZHFsZ3QxNm84YSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/6g3WkZ1rzDeIkkik1r/200.webp",
    "https://i.giphy.com/qPZ64DDFAUQU0.webp",
    "https://media0.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3aXVocjQweHZodTY4Z2RuanQyb2lkbm12dHVpNjJnZXM4OW1xNnJoNCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/To3fpw7TJWD6g/200.webp",
    "https://media.tenor.com/I0n7w-UIzycAAAAM/arangutan-monkey.gif",
    "https://www.icegif.com/wp-content/uploads/2022/10/icegif-1227.gif"
  ];

  function getAvatar(rank) {
    let skin, hair, accent;
    if (rank === 0) {
      skin = "#2d1f14"; hair = "#0a0706"; accent = "#3d2817";
    } else if (rank === 1) {
      skin = "#8d5524"; hair = "#1f120b"; accent = "#a66a35";
    } else {
      skin = "#f5d0b0"; hair = "#332211"; accent = "#e0b89e";
    }

    return `
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="50" fill="${accent}"/>
        <ellipse cx="50" cy="60" rx="24" ry="27" fill="${skin}"/>
        <path d="M20 34c8-10 18-14 30-14s22 4 30 14c-6-2-10 2-10 6-6-6-16-8-20-8s-14 2-20 8c0-4-4-8-10-6z" fill="${hair}"/>
        <path d="M18 38c-6 6-8 16-6 26 3-3 4-16 6-26z" fill="${hair}"/>
        <path d="M82 38c6 6 8 16 6 26-3-3-4-16-6-26z" fill="${hair}"/>
        <circle cx="30" cy="40" r="4" fill="${hair}"/>
        <circle cx="70" cy="40" r="4" fill="${hair}"/>
        ${rank === 2 ? `
        <circle cx="42" cy="28" r="3" fill="${hair}"/>
        <circle cx="58" cy="28" r="3" fill="${hair}"/>
        ` : ''}
        <ellipse cx="40" cy="62" rx="3.2" ry="4" fill="#1a1210"/>
        <ellipse cx="60" cy="62" rx="3.2" ry="4" fill="#1a1210"/>
        <path d="M41 78c3 3 15 3 18 0" stroke="#1a1210" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        ${rank === 2 ? `
        <path d="M33 52c2-3 6-4 9-2" stroke="#1a1210" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M67 52c-2-3-6-4-9-2" stroke="#1a1210" stroke-width="2" fill="none" stroke-linecap="round"/>
        ` : ''}
      </svg>`;
  }

  const board = document.getElementById("board");
  const statusEl = document.getElementById("status");

  function sortedPlayers() {
    return [...PLAYERS].sort((a, b) => (scores[b.name] || 0) - (scores[a.name] || 0));
  }

  function render(bumpName) {
    board.innerHTML = "";
    const sorted = sortedPlayers();

    sorted.forEach((p, i) => {
      const row = document.createElement("div");
      row.className = "row";
      row.style.setProperty("--rank-color", p.color);

      const isLeader = i === 0 && (scores[p.name] || 0) > 0;
      const avatarSvg = getAvatar(i);

      const avatarWrap = document.createElement("div");
      avatarWrap.className = "avatar-wrap";

      if (isLeader) {
        const orbit = document.createElement("div");
        orbit.className = "melon-orbit";
        for (let idx = 0; idx < 8; idx++) {
          const m = document.createElement("div");
          m.className = "melon-item";
          m.style.setProperty("--i", idx);
          m.textContent = "🍉";
          orbit.appendChild(m);
        }
        avatarWrap.appendChild(orbit);

        const kfc = document.createElement("span");
        kfc.className = "kfc-leg";
        kfc.textContent = "🍗";
        avatarWrap.appendChild(kfc);
      }

      const ring = document.createElement("div");
      ring.className = "avatar-ring" + (isLeader ? " leader" : "");
      ring.innerHTML = avatarSvg;
      avatarWrap.appendChild(ring);

      const info = document.createElement("div");
      info.className = "info";
      const nameEl = document.createElement("p");
      nameEl.className = "name";
      nameEl.textContent = p.name;
      const rankEl = document.createElement("p");
      rankEl.className = "rank-label";
      rankEl.textContent = "Platz " + (i + 1);
      info.append(nameEl, rankEl);

      const scoreEl = document.createElement("div");
      scoreEl.className = "score" + (p.name === bumpName ? " bump" : "");
      scoreEl.textContent = scores[p.name] ?? 0;
      setTimeout(() => scoreEl.classList.remove("bump"), 200);

      const btn = document.createElement("button");
      btn.className = "plus-btn";
      btn.type = "button";
      btn.disabled = true;
      btn.setAttribute("aria-label", "Punkt für " + p.name + " hinzufügen");
      btn.textContent = "+";

      row.append(avatarWrap, info, scoreEl, btn);
      board.appendChild(row);
    });
  }

  function loadScores() {
    scores = {
      "Ali": 50,
      "Luca": 20,
      "Alex": 40
    };
    render();
    statusEl.textContent = "";
  }

  function createMonkeys() {
    const container = document.getElementById('monkeyContainer');
    const emojis = ['🐒', '🐵', '🙈', '🙉', '🙊'];
    const count = 8;

    for (let i = 0; i < count; i++) {
      const monkey = document.createElement('div');
      monkey.className = 'monkey';
      const isLTR = Math.random() < 0.5;
      monkey.classList.add(isLTR ? 'monkey-ltr' : 'monkey-rtl');

      monkey.textContent = emojis[Math.floor(Math.random() * emojis.length)];

      const size = 1.2 + Math.random() * 1.8;
      monkey.style.fontSize = size + 'rem';

      const top = 10 + Math.random() * 70;
      monkey.style.top = top + '%';

      const flyDuration = 8 + Math.random() * 12;
      const wobbleDuration = 0.3 + Math.random() * 0.5;
      monkey.style.animationDuration = flyDuration + 's, ' + wobbleDuration + 's';

      monkey.style.animationDelay = (Math.random() * -20) + 's';

      container.appendChild(monkey);
    }
  }

  function setupMusic() {
    let started = false;
    const start = () => {
      if (started) return;
      started = true;

      const iframe = document.createElement('iframe');
      iframe.src = "https://www.youtube.com/embed/xgjKUJMzUr8?autoplay=1&loop=1&playlist=xgjKUJMzUr8&controls=0&showinfo=0&rel=0&iv_load_policy=3&disablekb=1&mute=0&enablejsapi=1";
      iframe.allow = "autoplay; encrypted-media";
      iframe.style.cssText = "position:fixed; bottom:0; right:0; width:0; height:0; border:0; opacity:0; pointer-events:none;";
      document.body.appendChild(iframe);

      document.removeEventListener('click', start);
      document.removeEventListener('keydown', start);
      document.removeEventListener('touchstart', start);
    };

    document.addEventListener('click', start, { once: true });
    document.addEventListener('keydown', start, { once: true });
    document.addEventListener('touchstart', start, { once: true });
  }

  function createBackground() {
    const bgContainer = document.getElementById('bg-pattern');
    const cellSize = 150;
    const cols = Math.ceil(window.innerWidth / cellSize) + 2;
    const rows = Math.ceil(window.innerHeight / cellSize) + 2;

    bgContainer.innerHTML = '';
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = document.createElement('div');
        cell.className = 'bg-cell';
        const url = gifUrls[Math.floor(Math.random() * gifUrls.length)];
        cell.style.backgroundImage = `url('${url}')`;
        bgContainer.appendChild(cell);
      }
    }
  }

  window.addEventListener('resize', createBackground);

  createBackground();
  createMonkeys();
  setupMusic();
  loadScores();
</script>

</body>
</html>
